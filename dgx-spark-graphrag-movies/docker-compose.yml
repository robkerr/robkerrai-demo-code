version: '3.8'

services:
  neo4j:
    image: neo4j:5.15
    container_name: cinegraph-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/cinegraph123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "cinegraph123", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cinegraph-network

  vllm:
    image: nvcr.io/nvidia/vllm:25.09-py3
    container_name: cinegraph-vllm
    restart: unless-stopped
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    environment:
      - HF_TOKEN=${HF_TOKEN}          # optional, if needed
    shm_size: 16gb
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "8001:8000"
    command: >
      vllm serve nvidia/Llama-3.1-8B-Instruct-FP8
      --quantization modelopt
      --gpu-memory-utilization 0.45
      --max-model-len 4096
      --max-num-seqs 32
      --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cinegraph-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cinegraph-backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=cinegraph123
      - VLLM_API_URL=http://vllm:8000/v1
      - BACKEND_PORT=8000
    volumes:
      - ./backend/movies.csv:/app/movies.csv:ro
    depends_on:
      neo4j:
        condition: service_healthy
      vllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cinegraph-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cinegraph-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cinegraph-network

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  cinegraph-network:
    driver: bridge

